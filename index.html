<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terrain Explorer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="info">Loading terrain…</div>
    <div id="crosshair" aria-hidden="true"></div>
    <div id="dig-progress" aria-hidden="true">
      <div id="dig-progress-fill"></div>
    </div>
    <div id="controls">
      Click to play · WASD · Shift sprint · Space jump · hold click or N to dig
    </div>
    <div id="jump-tune">
      <div class="jump-tune-row">
        <label for="gravity-slider">Gravity</label>
        <input type="range" id="gravity-slider" min="2" max="40" step="0.5" value="7" />
        <output id="gravity-value">7.0</output>
      </div>
      <div class="jump-tune-row">
        <label for="jump-velocity-slider">Jump velocity</label>
        <input
          type="range"
          id="jump-velocity-slider"
          min="0"
          max="14"
          step="0.1"
          value="4"
        />
        <output id="jump-velocity-value">4.0</output>
      </div>
      <div class="jump-tune-row">
        <label for="move-speed-slider">Move speed</label>
        <input
          type="range"
          id="move-speed-slider"
          min="2"
          max="20"
          step="0.5"
          value="7.5"
        />
        <output id="move-speed-value">7.5</output>
      </div>
      <div class="jump-tune-row">
        <label for="camera-height-slider" title="Eye height above your feet">
          Camera height
        </label>
        <input
          type="range"
          id="camera-height-slider"
          min="0.5"
          max="3"
          step="0.05"
          value="1.65"
        />
        <output id="camera-height-value">1.65</output>
      </div>
      <div class="jump-tune-row">
        <label for="dig-speed-slider">Dig speed</label>
        <input type="range" id="dig-speed-slider" min="0.25" max="2" step="0.05" value="0.5" />
        <output id="dig-speed-value">0.50×</output>
      </div>
      <div class="jump-tune-row">
        <label for="brightness-slider">Brightness</label>
        <input type="range" id="brightness-slider" min="0.5" max="2.5" step="0.05" value="1.75" />
        <output id="brightness-value">1.75</output>
      </div>
      <div class="jump-tune-row">
        <label for="graphics-slider">Graphics</label>
        <input type="range" id="graphics-slider" min="0" max="100" step="1" value="50" />
        <output id="graphics-value">Medium</output>
      </div>
      <div class="jump-tune-row">
        <label for="grass-slope-slider" title="Lower = more brown on slopes; higher = more green">
          Grass slope
        </label>
        <input
          type="range"
          id="grass-slope-slider"
          min="0"
          max="100"
          step="1"
          value="20"
        />
        <output id="grass-slope-value">0.20</output>
      </div>
      <div class="jump-tune-row">
        <label for="tree-flatness-slider" title="Max height variation allowed under a tree">
          Tree flatness
        </label>
        <input
          type="range"
          id="tree-flatness-slider"
          min="0.25"
          max="4"
          step="0.05"
          value="1.25"
        />
        <output id="tree-flatness-value">1.25</output>
      </div>
      <div class="jump-tune-row">
        <label for="tree-radius-slider" title="How wide an area is checked for flat ground">
          Tree check radius
        </label>
        <input type="range" id="tree-radius-slider" min="1" max="12" step="0.5" value="4" />
        <output id="tree-radius-value">4.0</output>
      </div>
      <div class="jump-tune-row">
        <label for="tree-count-slider">Tree count</label>
        <input type="range" id="tree-count-slider" min="0" max="16" step="1" value="4" />
        <output id="tree-count-value">4</output>
      </div>
      <div class="jump-tune-row">
        <label for="rock-clump-count-slider" title="How many rock clusters to place">
          Rock clumps
        </label>
        <input type="range" id="rock-clump-count-slider" min="0" max="40" step="1" value="14" />
        <output id="rock-clump-count-value">14</output>
      </div>
      <div class="jump-tune-row">
        <label for="rocks-per-clump-slider" title="Rocks in each cluster">
          Rocks per clump
        </label>
        <input type="range" id="rocks-per-clump-slider" min="1" max="12" step="1" value="4" />
        <output id="rocks-per-clump-value">4</output>
      </div>
      <div class="jump-tune-row">
        <label for="rock-clump-radius-slider" title="How far rocks spread from the clump center">
          Clump radius
        </label>
        <input
          type="range"
          id="rock-clump-radius-slider"
          min="0"
          max="8"
          step="0.25"
          value="2.5"
        />
        <output id="rock-clump-radius-value">2.5</output>
      </div>
      <div class="jump-tune-row">
        <label for="rock-clump-spacing-slider" title="Minimum distance between clump centers">
          Clump spacing
        </label>
        <input type="range" id="rock-clump-spacing-slider" min="2" max="12" step="1" value="3" />
        <output id="rock-clump-spacing-value">3</output>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

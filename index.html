<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Terrain Explorer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="bottom-hud">
      <div id="health-hud" aria-label="Health">
        <div id="health-bar-track">
          <div id="health-bar-fill"></div>
        </div>
        <span id="health-value">100</span>
      </div>
      <div id="inventory-hud" aria-label="Hotbar"></div>
    </div>
    <div id="inventory-panel" hidden aria-label="Inventory and crafting">
      <div class="inventory-panel-inner">
        <header class="inventory-panel-header">
          <h2 class="inventory-panel-title">Inventory</h2>
          <button
            type="button"
            class="inventory-close"
            data-inventory-close
            aria-label="Close inventory"
            title="Close (E)"
          >
            ×
          </button>
        </header>
        <div class="inventory-panel-body">
          <div class="inventory-column" aria-label="Items">
            <section class="inventory-section">
              <h3 class="inventory-section-label">Storage</h3>
              <div class="inventory-grid inventory-grid--backpack" data-backpack-grid></div>
            </section>
            <section class="inventory-section inventory-section--hotbar">
              <h3 class="inventory-section-label">Hotbar</h3>
              <div class="inventory-grid inventory-grid--hotbar" data-panel-hotbar></div>
            </section>
          </div>
          <aside class="inventory-craft-column" aria-label="Crafting">
            <h3 class="inventory-section-label">Crafting</h3>
            <div class="craft-scroll">
              <div class="craft-grid" data-craft-grid></div>
            </div>
          </aside>
        </div>
      </div>
      <div id="inventory-cursor-float" hidden aria-hidden="true"></div>
    </div>
    <div id="perf-hud" aria-hidden="true">--</div>
    <div id="info">Loading terrain…</div>
    <div id="crosshair" aria-hidden="true"></div>
    <div id="dig-progress" aria-hidden="true">
      <div id="dig-progress-fill"></div>
    </div>
    <div id="controls" hidden></div>
    <div id="jump-tune">
      <div class="jump-tune-row">
        <label for="gravity-slider">Gravity</label>
        <input type="range" id="gravity-slider" min="2" max="40" step="0.5" value="7" />
        <output id="gravity-value">7.0</output>
      </div>
      <div class="jump-tune-row">
        <label for="jump-velocity-slider">Jump velocity</label>
        <input
          type="range"
          id="jump-velocity-slider"
          min="0"
          max="14"
          step="0.1"
          value="4"
        />
        <output id="jump-velocity-value">4.0</output>
      </div>
      <div class="jump-tune-row">
        <label
          for="jetpack-hold-slider"
          title="Hold Space in the air for extra lift; 0 = off"
        >
          Jetpack hold
        </label>
        <input
          type="range"
          id="jetpack-hold-slider"
          min="0"
          max="1"
          step="0.05"
          value="0.85"
        />
        <output id="jetpack-hold-value">0.85</output>
      </div>
      <div class="jump-tune-row">
        <label for="move-speed-slider">Move speed</label>
        <input
          type="range"
          id="move-speed-slider"
          min="2"
          max="20"
          step="0.5"
          value="7.5"
        />
        <output id="move-speed-value">7.5</output>
      </div>
      <div class="jump-tune-row">
        <label for="camera-height-slider" title="Eye height above your feet">
          Camera height
        </label>
        <input
          type="range"
          id="camera-height-slider"
          min="0.5"
          max="3"
          step="0.05"
          value="0.75"
        />
        <output id="camera-height-value">0.75</output>
      </div>
      <div class="jump-tune-row">
        <label for="look-speed-slider" title="Mouse look sensitivity while pointer-locked">
          Look speed
        </label>
        <input
          type="range"
          id="look-speed-slider"
          min="0.25"
          max="8"
          step="0.05"
          value="1"
        />
        <output id="look-speed-value">1.00</output>
      </div>
      <div class="jump-tune-row">
        <label for="dig-speed-slider">Dig speed</label>
        <input type="range" id="dig-speed-slider" min="0.25" max="2" step="0.05" value="0.5" />
        <output id="dig-speed-value">0.50×</output>
      </div>
      <div class="jump-tune-row">
        <label
          for="debris-divisions-slider"
          title="Subdivisions per axis when a block breaks (more = smaller pieces)"
        >
          Debris pieces
        </label>
        <input type="range" id="debris-divisions-slider" min="1" max="8" step="1" value="4" />
        <output id="debris-divisions-value">64</output>
      </div>
      <div class="jump-tune-row">
        <label for="graphics-slider">Graphics</label>
        <input type="range" id="graphics-slider" min="0" max="100" step="1" value="50" />
        <output id="graphics-value">Medium</output>
      </div>
      <div class="jump-tune-row">
        <label for="fog-slider" title="Lower = thicker haze; higher = clearer distance">
          Fog
        </label>
        <input type="range" id="fog-slider" min="0" max="100" step="1" value="50" />
        <output id="fog-value">0.032</output>
      </div>
      <div class="jump-tune-row">
        <label for="grass-green-slope-slider" title="Terrain caps: lower = more dirt on slopes; higher = more green">
          Slope green
        </label>
        <input
          type="range"
          id="grass-green-slope-slider"
          min="0"
          max="100"
          step="1"
          value="20"
        />
        <output id="grass-green-slope-value">0.20</output>
      </div>
      <div class="jump-tune-row">
        <label
          for="grass-tuft-cluster-slider"
          title="3D grass blades: lower = even scatter; higher = dense tuft patches with bare gaps"
        >
          Tuft clustering
        </label>
        <input
          type="range"
          id="grass-tuft-cluster-slider"
          min="0"
          max="100"
          step="1"
          value="72"
        />
        <output id="grass-tuft-cluster-value">72%</output>
      </div>
      <div class="jump-tune-row">
        <label for="tree-flatness-slider" title="Max height variation allowed under a tree">
          Tree flatness
        </label>
        <input
          type="range"
          id="tree-flatness-slider"
          min="0.25"
          max="4"
          step="0.05"
          value="1.25"
        />
        <output id="tree-flatness-value">1.25</output>
      </div>
      <div class="jump-tune-row">
        <label for="tree-radius-slider" title="How wide an area is checked for flat ground">
          Tree check radius
        </label>
        <input type="range" id="tree-radius-slider" min="1" max="12" step="0.5" value="4" />
        <output id="tree-radius-value">4.0</output>
      </div>
      <div class="jump-tune-row">
        <label for="tree-count-slider">Tree count</label>
        <input type="range" id="tree-count-slider" min="0" max="48" step="1" value="14" />
        <output id="tree-count-value">14</output>
      </div>
      <div class="jump-tune-row">
        <label for="rock-clump-count-slider" title="How many rock clusters to place">
          Rock clumps
        </label>
        <input type="range" id="rock-clump-count-slider" min="0" max="40" step="1" value="14" />
        <output id="rock-clump-count-value">14</output>
      </div>
      <div class="jump-tune-row">
        <label for="rocks-per-clump-slider" title="Max rocks in each cluster (actual count is random up to this)">
          Max rocks per clump
        </label>
        <input type="range" id="rocks-per-clump-slider" min="1" max="12" step="1" value="4" />
        <output id="rocks-per-clump-value">4</output>
      </div>
      <div class="jump-tune-row">
        <label for="rock-clump-radius-slider" title="How far rocks spread from each cluster center">
          Rock spread
        </label>
        <input
          type="range"
          id="rock-clump-radius-slider"
          min="0"
          max="8"
          step="0.25"
          value="2.5"
        />
        <output id="rock-clump-radius-value">2.5</output>
      </div>
      <div class="jump-tune-row">
        <label for="rock-clump-spacing-slider" title="Minimum distance between rock cluster centers">
          Rock spacing
        </label>
        <input type="range" id="rock-clump-spacing-slider" min="2" max="12" step="1" value="3" />
        <output id="rock-clump-spacing-value">3</output>
      </div>
      <div class="jump-tune-row">
        <label
          for="enemy-spawn-rate-slider"
          title="Lower = slower spawns; higher = more frequent"
        >
          Enemy spawn rate
        </label>
        <input type="range" id="enemy-spawn-rate-slider" min="0" max="100" step="1" value="58" />
        <output id="enemy-spawn-rate-value">2.8s</output>
      </div>
      <div class="jump-tune-row">
        <label for="enemy-speed-slider" title="How fast enemies crawl">
          Enemy speed
        </label>
        <input type="range" id="enemy-speed-slider" min="0" max="100" step="1" value="58" />
        <output id="enemy-speed-value">1.79</output>
      </div>
      <div class="jump-tune-row">
        <label for="enemy-light-height-slider" title="Vertical offset of the glow inside the enemy mesh">
          Enemy light height
        </label>
        <input type="range" id="enemy-light-height-slider" min="0" max="100" step="1" value="50" />
        <output id="enemy-light-height-value">0.00</output>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
